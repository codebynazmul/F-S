<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>
body{background:radial-gradient(110% 150% at 82% 50%,#2A6A22 0%,#1C4719 38%,#10280F 100%);color:#fff}
svg.art{position:absolute;right:0;top:0}
.c{position:absolute;left:88px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;width:720px}
.row{display:flex;align-items:center;gap:22px}
.logo{width:84px;height:84px;border-radius:26px;background:#fff;padding:6px}
h1{font-size:64px;font-weight:800;line-height:1;letter-spacing:-.5px;white-space:nowrap}
.bnname{font-size:22px;color:var(--gold-300);font-weight:600;margin-top:4px}
p{font-size:23px;color:#D3E8C9;margin-top:24px;line-height:1.4;max-width:600px}
.meta{display:flex;gap:10px;margin-top:26px}
.chip{font-size:14px;color:#E4F1DC;border:1px solid rgba(143,200,116,.4);padding:7px 12px;border-radius:8px}
.chip b{color:var(--gold-300);font-weight:500}
.lbl{font-family:'DM Mono',monospace;font-size:11px;fill:#BFE0AE;letter-spacing:1px}
</style></head><body>
<svg class="art" width="560" height="400" viewBox="0 0 560 400" fill="none">
  <!-- field contours -->
  <g id="g" stroke="#8FC874" stroke-opacity=".22" stroke-width="1.4"></g>
  <!-- satellite orbit -->
  <ellipse cx="330" cy="170" rx="190" ry="70" stroke="#F7CB4D" stroke-opacity=".45" stroke-dasharray="3 7" transform="rotate(-14 330 170)"/>
  <circle cx="330" cy="170" r="44" fill="#F7CB4D" fill-opacity=".9"/>
  <circle cx="330" cy="170" r="64" stroke="#F7CB4D" stroke-opacity=".22"/>
  <g transform="translate(486 112) rotate(-14)">
    <rect x="-9" y="-6" width="18" height="12" rx="2" fill="#fff"/>
    <rect x="-31" y="-4" width="18" height="8" fill="#8FC874"/><rect x="13" y="-4" width="18" height="8" fill="#8FC874"/>
  </g>
  <!-- data pins -->
  <g fill="#fff"><circle cx="190" cy="300" r="4"/><circle cx="300" cy="330" r="4"/><circle cx="430" cy="290" r="4"/></g>
  <g stroke="#fff" stroke-opacity=".5"><path d="M190 300v-30"/><path d="M300 330v-28"/><path d="M430 290v-32"/></g>
  <text class="lbl" x="170" y="262">NDVI</text><text class="lbl" x="276" y="294">SMAP</text><text class="lbl" x="408" y="250">POWER</text>
</svg>
<script>const g=document.getElementById('g');for(let i=0;i<14;i++){const y=230+i*14;const p=document.createElementNS('http://www.w3.org/2000/svg','path');
p.setAttribute('d',`M0 ${y+30} C 150 ${y-28+i*2}, 330 ${y+46}, 560 ${y-14-i*3}`);if(i%4===0){p.setAttribute('stroke','#F7CB4D');p.setAttribute('stroke-opacity','.4')}g.appendChild(p)}</script>
<div class="c">
  <div class="row"><img class="logo" src="../../../../public/logo.png" alt=""><div><h1 class="display">Agro Cosmic Weave</h1><div class="bnname bn">অ্যাগ্রো কসমিক উইভ</div></div></div>
  <p>Climate-adaptive crop rotation and soil health planner for all 64 districts of Bangladesh.</p>
  <div class="meta mono"><span class="chip"><b>NASA</b> POWER · MODIS · SMAP · NASADEM</span><span class="chip">English | <span class="bn">বাংলা</span></span><span class="chip">Team SPIDERX</span></div>
</div>
</body></html>
